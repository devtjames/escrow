<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FEDPOFFA student login.">
    <meta name="theme-color" content="#0B3D91">
    <title>Student Login | FEDPOFFA</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="../assets/js/ui.js" defer></script>
    <script src="../assets/js/student.js" defer></script>
  </head>
  <body class="font-sans antialiased">
    <div class="portal-shell dark:text-slate-100">
      <header class="glass-nav sticky top-0 z-50">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
          <a href="../index.html" class="flex items-center gap-3"><span class="grid h-11 w-11 place-items-center rounded-lg bg-fedpoffa-blue text-sm font-black text-white">FP</span><span><span class="block text-sm font-black text-slate-950 dark:text-white">FEDPOFFA</span><span class="block text-xs font-semibold text-slate-500 dark:text-slate-400">Student Portal</span></span></a>
          <div class="hidden items-center gap-2 md:flex"><a class="nav-link" href="../index.html">Home</a><a class="nav-link is-active" href="./login.html">Login</a><a class="nav-link" href="./register.html">Register</a></div>
          <button data-theme-toggle class="icon-btn" type="button" aria-label="Toggle dark mode"></button>
        </nav>
      </header>
      <main class="mx-auto max-w-5xl px-4 pb-24 pt-8 sm:px-6 lg:px-8">
        <section class="view grid gap-6 lg:grid-cols-[0.85fr_1.15fr]">
          <aside class="card rounded-lg p-6">
            <div class="page-kicker"><span data-icon="login"></span> Student access</div>
            <h1 class="mt-5 text-3xl font-black text-slate-950 dark:text-white">Login to continue your fee payment</h1>
            <p class="mt-3 text-sm leading-6 text-slate-600 dark:text-slate-300">Use your matric number to open the student dashboard, add funds, view receipts, and track fee clearance.</p>
          </aside>
          <form class="card rounded-lg p-5 sm:p-7" data-student-login>
            <h2 class="text-2xl font-black text-slate-950 dark:text-white">Student Login</h2>
            <div class="mt-5 grid gap-4">
              <label class="form-label">Matric Number<input class="input" autocomplete="username" placeholder="FPO/HND/24/0412" required></label>
              <label class="form-label">Password<input class="input" type="password" autocomplete="current-password" placeholder="Enter password" required></label>
              <button class="btn-primary w-full" type="submit"><span data-icon="login"></span> Login</button>
              <a class="btn-secondary w-full" href="./register.html"><span data-icon="userPlus"></span> Create Student Account</a>
            </div>
          </form>
        </section>
      </main>
      <nav class="fixed inset-x-0 bottom-0 z-50 border-t border-slate-200 bg-white/95 px-2 py-2 shadow-[0_-18px_40px_rgba(15,23,42,0.12)] backdrop-blur dark:border-slate-800 dark:bg-slate-950/95 md:hidden"><div class="mx-auto grid max-w-md grid-cols-3 gap-1"><a class="mobile-nav-link" href="../index.html">Home</a><a class="mobile-nav-link is-active" href="./login.html">Login</a><a class="mobile-nav-link" href="./register.html">Register</a></div></nav>
    </div>
    <div id="toastStack" class="fixed right-3 top-20 z-[90] grid w-[calc(100vw-1.5rem)] max-w-sm gap-3 sm:right-5"></div>
  </body>
</html>
