<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FEDPOFFA student dashboard.">
    <meta name="theme-color" content="#0B3D91">
    <title>Student Dashboard | FEDPOFFA</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="../assets/js/ui.js" defer></script>
    <script src="../assets/js/student.js" defer></script>
  </head>
  <body class="font-sans antialiased">
    <div class="portal-shell dark:text-slate-100">
      <header class="glass-nav sticky top-0 z-50"><nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8"><a href="../index.html" class="flex items-center gap-3"><span class="grid h-11 w-11 place-items-center rounded-lg bg-fedpoffa-blue text-sm font-black text-white">FP</span><span><span class="block text-sm font-black text-slate-950 dark:text-white">FEDPOFFA</span><span class="block text-xs font-semibold text-slate-500 dark:text-slate-400">Student Portal</span></span></a><div class="hidden items-center gap-2 md:flex"><a class="nav-link is-active" href="./dashboard.html">Dashboard</a><a class="nav-link" href="./payment.html">Payment</a><a class="nav-link" href="./transactions.html">History</a><a class="nav-link" href="./login.html">Logout</a></div><button data-theme-toggle class="icon-btn" type="button" aria-label="Toggle dark mode"></button></nav></header>
      <main class="mx-auto max-w-7xl px-4 pb-28 pt-6 sm:px-6 lg:px-8">
        <section class="view grid gap-5 py-4">
          <div class="card rounded-lg p-5"><div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"><div class="min-w-0"><h1 class="text-2xl font-black text-slate-950 dark:text-white sm:text-3xl">Student Dashboard</h1><p class="mt-1 truncate text-sm font-semibold text-slate-500 dark:text-slate-400"><span data-text="studentName"></span> | <span data-text="matric"></span></p></div><span data-status-pill class="status-pill">ACTIVE</span></div></div>
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <article class="card rounded-lg p-5"><p class="text-xs font-black uppercase tracking-wide text-slate-500 dark:text-slate-400">Total fee</p><h2 class="mt-3 text-2xl font-black text-slate-950 dark:text-white" data-text="totalFee">...</h2><p class="mt-2 text-sm font-semibold text-slate-500 dark:text-slate-400">Session target</p></article>
            <article class="card rounded-lg p-5"><p class="text-xs font-black uppercase tracking-wide text-slate-500 dark:text-slate-400">Paid amount</p><h2 class="mt-3 text-2xl font-black text-slate-950 dark:text-white" data-text="paidAmount">...</h2><p class="mt-2 text-sm font-semibold text-slate-500 dark:text-slate-400"><span data-text="progress"></span> complete</p></article>
            <article class="card rounded-lg p-5"><p class="text-xs font-black uppercase tracking-wide text-slate-500 dark:text-slate-400">Remaining</p><h2 class="mt-3 text-2xl font-black text-slate-950 dark:text-white" data-text="remainingAmount">...</h2><p class="mt-2 text-sm font-semibold text-slate-500 dark:text-slate-400">Balance due</p></article>
            <article class="card rounded-lg p-5"><p class="text-xs font-black uppercase tracking-wide text-slate-500 dark:text-slate-400">Due date</p><h2 class="mt-3 text-2xl font-black text-slate-950 dark:text-white" data-text="dueDate">...</h2><p class="mt-2 text-sm font-semibold text-slate-500 dark:text-slate-400" data-text="session">...</p></article>
          </div>
          <div class="grid gap-5 lg:grid-cols-[1.2fr_0.8fr]">
            <section class="card rounded-lg p-5"><div class="flex flex-wrap items-start justify-between gap-4"><div><h2 class="text-xl font-black text-slate-950 dark:text-white">Fee Overview</h2><p class="mt-1 text-sm font-semibold text-slate-500 dark:text-slate-400"><span data-text="program"></span> | <span data-text="level"></span></p></div><span data-status-pill class="status-pill">ACTIVE</span></div><div class="mt-7"><div class="mb-2 flex justify-between text-sm font-bold text-slate-600 dark:text-slate-300"><span>Payment progress</span><span data-text="progress">0%</span></div><div class="h-4 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-full rounded-full bg-gradient-to-r from-fedpoffa-blue to-green-500 transition-[width] duration-700" style="width:0%" data-progress-bar></div></div></div><div class="mt-7 flex flex-col gap-3 sm:flex-row"><button class="btn-primary w-full sm:w-auto" data-open-deposit data-deposit-button="Deposit" type="button"></button><a class="btn-secondary w-full sm:w-auto" href="./payment.html"><span data-icon="wallet"></span> View Checkout</a><button class="btn-secondary w-full sm:w-auto" data-open-receipt type="button"><span data-icon="receipt"></span> Receipt Preview</button></div></section>
            <aside class="card rounded-lg p-5"><h2 class="text-xl font-black text-slate-950 dark:text-white">Wallet Activity</h2><div class="mt-4 grid gap-3" data-recent-transactions></div></aside>
          </div>
        </section>
      </main>
      <button class="btn-primary fixed bottom-20 right-4 z-40 shadow-2xl md:bottom-6" data-open-deposit data-deposit-button="Deposit" type="button"></button>
      <nav class="fixed inset-x-0 bottom-0 z-50 border-t border-slate-200 bg-white/95 px-2 py-2 shadow-[0_-18px_40px_rgba(15,23,42,0.12)] backdrop-blur dark:border-slate-800 dark:bg-slate-950/95 md:hidden"><div class="mx-auto grid max-w-md grid-cols-4 gap-1"><a class="mobile-nav-link is-active" href="./dashboard.html"><span data-icon="table"></span><span>Dash</span></a><a class="mobile-nav-link" href="./payment.html"><span data-icon="wallet"></span><span>Pay</span></a><a class="mobile-nav-link" href="./transactions.html"><span data-icon="receipt"></span><span>History</span></a><a class="mobile-nav-link" href="./login.html"><span data-icon="login"></span><span>Logout</span></a></div></nav>
    </div>
    <div id="modalRoot" class="fixed inset-0 z-[70] hidden items-end justify-center bg-slate-950/60 p-3 backdrop-blur-sm sm:items-center" role="dialog" aria-modal="true"></div><div id="toastStack" class="fixed right-3 top-20 z-[90] grid w-[calc(100vw-1.5rem)] max-w-sm gap-3 sm:right-5"></div>
  </body>
</html>
