  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="FEDPOFFA admin registration."><meta name="theme-color" content="#0B3D91"><title>Admin Registration | FEDPOFFA</title><link rel="stylesheet" href="../assets/css/styles.css"><script src="../assets/js/ui.js" defer></script><script src="../assets/js/admin.js" defer></script></head>
  <body class="font-sans antialiased"><div class="portal-shell dark:text-slate-100"><header class="glass-nav sticky top-0 z-50"><nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8"><a href="./login.html" class="flex items-center gap-3"><span class="grid h-11 w-11 place-items-center rounded-lg bg-slate-950 text-sm font-black text-white dark:bg-blue-600">AD</span><span><span class="block text-sm font-black text-slate-950 dark:text-white">FEDPOFFA Admin</span><span class="block text-xs font-semibold text-slate-500 dark:text-slate-400">Finance Office Portal</span></span></a><div class="hidden items-center gap-2 xl:flex"><a class="nav-link" href="./login.html">Login</a><a class="nav-link is-active" href="./register.html">Register</a></div><button data-theme-toggle class="icon-btn" type="button" aria-label="Toggle dark mode"></button></nav></header><main class="mx-auto max-w-5xl px-4 pb-24 pt-8 sm:px-6 lg:px-8"><form class="view card rounded-lg p-5 sm:p-7" data-admin-register><div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"><div><div class="page-kicker"><span data-icon="userPlus"></span> Admin registration</div><h1 class="mt-4 text-3xl font-black text-slate-950 dark:text-white">Request Admin Account</h1><p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">For finance, bursary, ICT, and authorized school officers.</p></div><a class="btn-secondary" href="./login.html">Login</a></div><div class="form-grid mt-6"><label class="form-label">Full Name<input class="input" required></label><label class="form-label">Staff ID<input class="input" placeholder="FPO/FIN/001" required></label><label class="form-label">Official Email<input class="input" type="email" required></label><label class="form-label">Role<select class="input" required><option>Finance Officer</option><option>Bursary Admin</option><option>ICT Admin</option><option>Faculty Officer</option></select></label><label class="form-label">Password<input class="input" type="password" required></label><label class="form-label">Confirm Password<input class="input" type="password" required></label></div><button class="btn-primary mt-6 w-full sm:w-auto" type="submit"><span data-icon="save"></span> Submit Request</button></form></main></div><div id="toastStack" class="fixed right-3 top-20 z-[90] grid w-[calc(100vw-1.5rem)] max-w-sm gap-3 sm:right-5"></div></body>
